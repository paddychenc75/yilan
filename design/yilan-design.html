<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>一览 设计稿 v1.0</title>
<style>
/* 画布：像 Figma 一样的深灰画布，所有画板按“章节 → 画板”排列，画板尺寸固定，方便导入 Figma 后直接成为 Frame */
:root{
  --canvas:#18191c; --canvas-2:#222327; --label:#9a9ca3; --label-2:#d7d9de;
  --stage:#050506;
  --t1:#ffffff; --t2:rgba(255,255,255,.68); --t3:rgba(255,255,255,.44); --t4:rgba(255,255,255,.18);
  /* 控件强调色跟随系统强调色（默认蓝色），不使用品牌色——看图界面保持中性 */
  --accent:#0a84ff; --red:#ff453a; --yellow:#ffd60a; --green:#30d158; --orange:#ff9f0a; --purple:#bf5af2;
  --glass:linear-gradient(180deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.09) 45%,rgba(255,255,255,.06) 100%);
  --glass-line:rgba(255,255,255,.17);
  --thick:linear-gradient(180deg,rgba(58,58,64,.78) 0%,rgba(34,34,38,.82) 100%);
  /* 品牌色（松石绿）：取自 App 图标（yilan-icon.svg），和 app/Yilan/Views/Theme.swift 的 Theme.Brand 保持一致。
     只用于没有图片时的环境光、拖入遮罩；不用在开关、滑块、按钮和看图界面上 */
  --brand-teal:#128a80; --brand-jade:#3fc4b0; --brand-teal-deep:#0e3b3b; --brand-sun:#ffe2a0;
  --brand-teal-night:#061717; /* brand-teal-deep 每个通道 ×0.4 压暗，拖入遮罩用 */
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","PingFang SC",sans-serif;
  --sfd:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro","PingFang SC",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--t1);font-family:var(--sf);-webkit-font-smoothing:antialiased}
.doc{width:1600px;margin:0 auto;padding:64px 80px 160px;display:flex;flex-direction:column;gap:120px}
.chapter{display:flex;flex-direction:column;gap:40px}
.chapter>header{display:flex;align-items:baseline;gap:20px;border-bottom:1px solid #2c2e33;padding-bottom:16px}
.chapter>header b{font:600 15px var(--mono);color:var(--label)}
.chapter>header h2{margin:0;font:700 34px/1.2 var(--sfd);letter-spacing:-.01em}
.chapter>header p{margin:0 0 0 auto;color:var(--label);font-size:14px;max-width:560px;text-align:right}
.frames{display:flex;flex-wrap:wrap;gap:64px 56px;align-items:flex-start}
.frame{display:flex;flex-direction:column;gap:12px}
.cap{display:flex;gap:12px;align-items:baseline;font-size:13px;color:var(--label-2)}
.cap b{font-weight:600}
.cap span{color:var(--label);font-family:var(--mono);font-size:12px}
.cap i{font-style:normal;color:var(--label);margin-left:auto}
.note{font-size:12.5px;color:var(--label);max-width:640px;line-height:1.6;margin:0}

/* ---------- 窗口 ---------- */
.win{position:relative;overflow:hidden;border-radius:16px;background:var(--stage);flex:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 40px 90px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.35)}
.win.fs{border-radius:0;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.amb{position:absolute;inset:-18%;background-size:cover;background-position:center;filter:blur(80px) saturate(1.7) brightness(.5)}
.vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.5) 100%)}
.photo{position:absolute;border-radius:4px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4)}
.photo img{width:100%;height:100%;display:block;object-fit:cover}
.photo.flat{border-radius:0;box-shadow:none}

.g{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 28px rgba(0,0,0,.30)}
.gt{background:var(--thick);-webkit-backdrop-filter:blur(44px) saturate(1.6);backdrop-filter:blur(44px) saturate(1.6);
  border:1px solid rgba(255,255,255,.11);box-shadow:0 24px 60px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.3)}

.btn,.tools,.pill,.badge-ic,.mat .s{position:relative}
.tb{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;padding:0 16px 0 20px;gap:14px}
.lights{display:flex;gap:8px;flex:none}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.lights.dim i{background:rgba(255,255,255,.22)}
.ttl{display:flex;flex-direction:column;gap:1px;min-width:0}
.ttl b{font:600 13px/16px var(--sf);white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.ttl span{font:400 11px/14px var(--sf);color:var(--t2);white-space:nowrap}
.tb .sp{flex:1}
.seg{position:absolute;left:50%;top:10px;transform:translateX(-50%);height:36px;width:max-content;border-radius:18px;padding:3px;display:flex;gap:2px}
.seg>div{height:28px;border-radius:14px;padding:0 13px;display:flex;align-items:center;gap:6px;font:500 12.5px var(--sf);color:rgba(255,255,255,.82);white-space:nowrap}
.seg>div svg{width:14px;height:14px;opacity:.85}
.seg>div em{font-style:normal;font:500 11px var(--mono);color:var(--t3)}
.seg>div.on{background:rgba(255,255,255,.24);color:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.seg>div.on em{color:rgba(255,255,255,.75)}
.seg>div.off{opacity:.32}
.seg.ico>div{padding:0 10px}
.pill{height:36px;border-radius:18px;padding:0 14px;display:flex;align-items:center;font:500 12px var(--mono);white-space:nowrap}
.tools{height:36px;border-radius:18px;padding:0 3px;display:flex;align-items:center;gap:2px}
.ib{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;color:#fff}
.ib svg{width:17px;height:17px}
.ib.on{background:rgba(255,255,255,.24)}
.ib.hover{background:rgba(255,255,255,.12)}
.ib.dis{opacity:.3}

.nav{position:absolute;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:#fff}
.nav svg{width:20px;height:20px}

.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;border-radius:24px;padding:9px 12px 10px;display:flex;flex-direction:column;gap:6px}
.meta{display:flex;justify-content:space-between;gap:16px;padding:0 4px;font:400 11.5px/16px var(--sf);color:var(--t2);white-space:nowrap}
.meta b{color:#fff;font-weight:600;margin-right:8px}
.meta .num{font-family:var(--mono);font-size:11px}
.strip{overflow:hidden;height:62px;position:relative}
.strip.fl{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28px);mask-image:linear-gradient(90deg,transparent 0,#000 28px)}
.strip.fr{-webkit-mask-image:linear-gradient(270deg,transparent 0,#000 28px);mask-image:linear-gradient(270deg,transparent 0,#000 28px)}
.strip.fl.fr{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%)}
.rail{position:absolute;top:5px;left:0;display:flex;gap:6px}
.th{position:relative;width:76px;height:52px;border-radius:10px;overflow:hidden;flex:none;background:#1c1d21;opacity:.66}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.on{opacity:1;transform:scale(1.12);box-shadow:0 0 0 2px #fff,0 6px 16px rgba(0,0,0,.5);z-index:2}
.th.hov{opacity:.95}
.th.err{display:grid;place-items:center;background:#2a2b30;color:var(--yellow)}
.th.err svg{width:18px;height:18px}
.th.load{background:linear-gradient(100deg,#25262b 30%,#34353b 50%,#25262b 70%)}
.bdg{position:absolute;right:4px;bottom:4px;height:15px;padding:0 4px;border-radius:5px;background:rgba(0,0,0,.58);font:600 9.5px/15px var(--sf);color:#fff;display:flex;align-items:center;gap:2px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.bdg svg{width:8px;height:8px}
.bdg.l{left:4px;right:auto}

.vbar{position:absolute;left:50%;transform:translateX(-50%);height:46px;border-radius:23px;padding:0 14px 0 7px;display:flex;align-items:center;gap:12px;font:500 11.5px var(--mono);color:#fff}
.vbar .pb{width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.vbar .pb svg{width:14px;height:14px}
.vbar .ic{width:17px;height:17px;color:var(--t2);flex:none}
.trk{position:relative;flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.2)}
.trk .buf{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgba(255,255,255,.28)}
.trk .pl{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#fff}
.trk .kn{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.trk .tip{position:absolute;bottom:16px;transform:translateX(-50%);padding:3px 7px;border-radius:7px;font:500 11px var(--mono);white-space:nowrap}
.vol{width:56px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);position:relative;flex:none}
.vol i{position:absolute;left:0;top:0;bottom:0;width:70%;border-radius:2px;background:rgba(255,255,255,.85)}
.bigplay{position:absolute;width:78px;height:78px;border-radius:39px;display:grid;place-items:center;color:#fff}
.bigplay svg{width:28px;height:28px;margin-left:4px}

.chip{position:absolute;left:50%;transform:translateX(-50%);height:34px;border-radius:17px;padding:0 14px 0 10px;display:flex;align-items:center;gap:9px;font:500 12px var(--sf);white-space:nowrap}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.22);border-top-color:#fff;border-right-color:#fff}
.mini{width:54px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);position:relative}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff}
.chip .num{font-family:var(--mono);color:var(--t2);font-size:11px}

.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:26px;padding:30px 32px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.card h3{margin:6px 0 0;font:600 17px/1.35 var(--sfd)}
.card p{margin:0;font-size:13px;line-height:1.6;color:var(--t2)}
.card code{font:400 11.5px var(--mono);color:var(--t3);background:rgba(0,0,0,.25);border-radius:6px;padding:4px 8px;margin-top:2px}
.btns{display:flex;gap:10px;margin-top:12px}
.btn{height:32px;border-radius:16px;padding:0 16px;display:flex;align-items:center;gap:7px;font:500 13px var(--sf);white-space:nowrap;color:#fff}
.btn svg{width:15px;height:15px}
.btn.pri{background:#fff;color:#111;border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.btn.blue{background:var(--accent);border-color:transparent}
.btn.red{background:var(--red);border-color:transparent}
.btn.hover{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.14))}
.btn.press{background:rgba(255,255,255,.08);transform:scale(.97)}
.btn.dis{opacity:.35}
.badge-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.badge-ic svg{width:26px;height:26px}

.info{position:absolute;right:16px;top:64px;width:272px;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;font-size:12px}
.info .hd{display:flex;gap:10px;align-items:center}
.info .hd img{width:44px;height:44px;border-radius:9px;object-fit:cover}
.info .hd b{display:block;font:600 13px var(--sf)}
.info .hd span{font-size:11px;color:var(--t2)}
.info h5{margin:0 0 6px;font:600 10.5px var(--sf);letter-spacing:.06em;color:var(--t3)}
.kv{display:flex;flex-direction:column;gap:6px}
.kv div{display:flex;justify-content:space-between;gap:10px}
.kv span{color:var(--t2)}
.kv b{font-weight:500;font-family:var(--sf)}
.kv .m{font-family:var(--mono);font-size:11.5px}
.exif{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.exif div{border-radius:9px;background:rgba(255,255,255,.08);padding:7px 0;text-align:center;font:500 11.5px var(--mono)}
.exif small{display:block;font:400 9.5px var(--sf);color:var(--t3);margin-top:2px}
.hr{height:1px;background:rgba(255,255,255,.1)}
.hist{border-radius:10px;background:rgba(0,0,0,.25);padding:8px}

.toast{position:absolute;left:50%;transform:translateX(-50%);height:34px;border-radius:17px;padding:0 16px;display:flex;align-items:center;gap:8px;font:500 12px var(--sf);white-space:nowrap}
.toast svg{width:15px;height:15px}
.toast a{color:#64b5ff;font-weight:600;margin-left:6px}

.menu{position:absolute;border-radius:14px;padding:5px;display:flex;flex-direction:column;font:400 13px var(--sf);min-width:240px}
.mi{height:24px;border-radius:7px;padding:0 9px 0 8px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mi svg{width:15px;height:15px;color:var(--t2)}
.mi .ck{width:12px;font-size:11px;color:#fff;text-align:center}
.mi kbd{margin-left:auto;padding-left:24px;font:400 12.5px var(--sf);color:var(--t3);letter-spacing:.06em}
.mi.on{background:var(--accent)}
.mi.on svg,.mi.on kbd{color:#fff}
.mi.red{color:#ff6961}.mi.red svg{color:#ff6961}
.mi.dis{color:var(--t3)}
.msep{height:1px;background:rgba(255,255,255,.12);margin:5px 9px}
.mhead{font:600 11px var(--sf);color:var(--t3);padding:4px 9px 2px}
.cursor{position:absolute;z-index:46;width:22px;height:28px;z-index:20;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}

.dim{position:absolute;inset:0;background:rgba(0,0,0,.38)}
.alert{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;border-radius:26px;padding:22px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.alert h3{margin:6px 0 0;font:600 14px/1.4 var(--sfd)}
.alert p{margin:0;font-size:12px;color:var(--t2);line-height:1.55}
.alert .btns{width:100%;margin-top:12px}
.alert .btn{flex:1;justify-content:center}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);margin-top:4px}
.chk i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06)}

.drop{position:absolute;inset:10px;z-index:40;border-radius:20px;border:2px dashed rgba(255,255,255,.5);background:rgba(6,23,23,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.drop h3{margin:8px 0 0;font:600 20px var(--sfd)}
.drop p{margin:0;color:var(--t2);font-size:13px}

.nav-map{position:absolute;right:16px;top:64px;border-radius:14px;padding:6px;width:172px}
.nav-map .m{position:relative;width:160px;height:107px;border-radius:8px;overflow:hidden}
.nav-map img{width:100%;height:100%;object-fit:cover;display:block;opacity:.75}
.nav-map .vp{position:absolute;border:1.5px solid #fff;border-radius:3px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}

/* 普通窗口（设置、关于） */
.mwin{position:relative;overflow:hidden;border-radius:22px;background:#1e1e21;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 80px rgba(0,0,0,.5);flex:none}
.side{position:absolute;left:8px;top:8px;bottom:8px;width:212px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.08);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .lights{margin:0 0 18px 6px}
.srch{height:28px;border-radius:9px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:6px;padding:0 9px;color:var(--t3);font-size:12.5px;margin-bottom:10px}
.srch svg{width:14px;height:14px}
.si{height:30px;border-radius:8px;display:flex;align-items:center;gap:9px;padding:0 8px;font-size:13px}
.si i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff}
.si i svg{width:13px;height:13px}
.si.on{background:rgba(255,255,255,.12)}
.pane{position:absolute;left:236px;right:0;top:0;bottom:0;padding:22px 28px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.pane h1{margin:0 0 2px;font:700 20px var(--sfd)}
.grp{border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.row{min-height:40px;display:flex;align-items:center;gap:12px;padding:8px 14px;font-size:13px}
.row+.row{border-top:1px solid rgba(255,255,255,.07)}
.row .lb{flex:1}
.row .lb small{display:block;color:var(--t3);font-size:11.5px;margin-top:2px}
.tg{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.18);position:relative;flex:none}
.tg i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tg.on{background:var(--accent)}.tg.on i{left:18px}
.pop{height:24px;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.06);padding:0 6px 0 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.pop svg{width:11px;height:11px;color:var(--t2)}
.sseg{display:flex;border-radius:7px;background:rgba(255,255,255,.08);padding:2px;font-size:12px}
.sseg span{padding:3px 12px;border-radius:5px}
.sseg span.on{background:rgba(255,255,255,.22);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sl{width:150px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);position:relative}
.sl i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.sl b{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.val{font:500 12px var(--mono);color:var(--t2);width:32px;text-align:right}
.fmts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
.fmts span{font:500 11px var(--mono);padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--t2)}

/* 规范页 */
.sheet{background:#0e0f11;border-radius:20px;padding:40px;width:1440px;display:flex;flex-direction:column;gap:28px;box-shadow:0 0 0 1px #2a2c31}
.sheet h3{margin:0;font:700 22px var(--sfd)}
.sheet h3 small{font:400 13px var(--sf);color:var(--label);margin-left:12px}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.sw>div{display:flex;flex-direction:column;gap:8px}
.sw .c{height:84px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.sw b{font-size:13px}.sw span{font:400 11.5px var(--mono);color:var(--label)}.sw em{font-style:normal;font-size:12px;color:var(--label)}
.tt{display:flex;flex-direction:column}
.tt>div{display:grid;grid-template-columns:150px 1fr 260px;align-items:baseline;gap:24px;padding:14px 0;border-top:1px solid #23252a}
.tt span{font:400 12px var(--mono);color:var(--label)}
.mat{position:relative;height:300px;border-radius:18px;overflow:hidden}
.mat>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mat .row4{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:36px;align-items:center}
.mat .s{height:200px;border-radius:24px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font-size:12px}
.mat .s b{font-size:15px}
.mat .s span{font:400 11px var(--mono);color:var(--t2);line-height:1.6}
.iconset{display:grid;grid-template-columns:repeat(10,1fr);gap:12px}
.iconset div{height:92px;border-radius:14px;background:#17181b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:11px;color:var(--label)}
.iconset svg{width:24px;height:24px;color:#fff}
.radii{display:flex;gap:28px;align-items:flex-end}
.radii div{display:flex;flex-direction:column;gap:10px;align-items:center;font-size:12px;color:var(--label)}
.radii i{display:block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25)}
.spaces{display:flex;gap:20px;align-items:flex-end}
.spaces div{display:flex;flex-direction:column;align-items:center;gap:8px;font:400 11px var(--mono);color:var(--label)}
.spaces i{display:block;background:#ff2d92;opacity:.75;height:24px}
.motion{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.motion>div{border-radius:14px;background:#17181b;padding:18px;display:flex;flex-direction:column;gap:6px}
.motion b{font-size:14px}.motion span{font:400 12px var(--mono);color:var(--label)}.motion p{margin:0;font-size:12.5px;color:#b9bcc3;line-height:1.55}

/* 组件页 */
.board{position:relative;border-radius:20px;overflow:hidden;padding:36px;display:flex;flex-direction:column;gap:26px}
.board>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(30px) brightness(.55) saturate(1.4);transform:scale(1.15)}
.board>*{position:relative}
.crow{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.cl{font:600 11px var(--sf);letter-spacing:.06em;color:rgba(255,255,255,.55);width:120px;flex:none}
.var{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:11px;color:rgba(255,255,255,.6)}
.rel{position:relative}

/* 标注 */
.rl{position:absolute;background:#ff2d92;z-index:30}
.rl.h{height:1px}.rl.v{width:1px}
.rlb{position:absolute;z-index:31;background:#ff2d92;color:#fff;font:600 10.5px var(--mono);padding:2px 5px;border-radius:4px;white-space:nowrap}
.rbox{position:absolute;border:1px dashed #ff2d92;z-index:30;border-radius:4px}

/* 图标 */
.appicon{display:block}
.iconrow{display:flex;gap:40px;align-items:flex-end}
.iconrow .var{color:var(--label)}
.tile{border-radius:20px;padding:36px;display:flex;gap:36px;align-items:flex-end}

.cover{position:relative;width:1440px;height:810px;border-radius:20px;overflow:hidden}
.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,0) 100%)}
.cover .gcard{position:absolute;left:72px;top:72px;bottom:72px;width:560px;border-radius:36px;padding:48px;display:flex;flex-direction:column;gap:18px}
.cover h1{margin:0;font:700 76px/1 var(--sfd);letter-spacing:-.02em}
.cover h1 small{display:block;font:500 26px var(--sfd);color:var(--t2);margin-top:12px;letter-spacing:0}
.cover .toc{margin-top:auto;display:flex;flex-direction:column;gap:9px;font-size:14px;color:var(--t2)}
.cover .toc div{display:flex;gap:14px}
.cover .toc b{font:500 13px var(--mono);color:var(--t3);width:24px}
.howto{background:#202125;border:1px solid #2e3035;border-radius:16px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:#c9ccd2;line-height:1.6;max-width:1440px}
.howto b{color:#fff}
.howto ol{margin:0;padding-left:1.3em}

/* ---------- v0.2 ---------- */
/* 信息面板 v0.2：宽 300，浮在图片上（距右 16、距顶 64），厚玻璃，圆角 22，内边距 16。图片不让位。
   底边不盖住缩略图栏 / 视频控制条：最多到它们上沿 − 12（缩略图栏上沿距底 132 → 面板距底 144）；底部没有控件时距底 16。
   放不下时中间的分组在面板里滚动，顶部和底部按钮不动 */
.ip{position:absolute;right:16px;top:64px;max-height:calc(100% - 208px);width:300px;border-radius:22px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:14px;font-size:12px;overflow:hidden}
.ip .hd{display:flex;gap:10px;align-items:center}
.ip .hd img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none}
.ip .hd>div:not(.x){min-width:0;flex:1}
.ip .hd b{display:block;font:600 13px/17px var(--sf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ip .hd span{font-size:11px;color:var(--t2)}
.ip .x{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;color:var(--t2);background:rgba(255,255,255,.08);flex:none}
.ip .x svg{width:12px;height:12px}
.ip section{display:flex;flex-direction:column;gap:8px}
.ip .ipb{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:14px;position:relative;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent)}
.ip .ipb::after{content:'';position:absolute;right:-10px;top:4px;width:3px;height:42%;border-radius:2px;background:rgba(255,255,255,.28)}
.ip h5{margin:0;display:flex;align-items:center;gap:6px;font:600 10.5px var(--sf);letter-spacing:.06em;color:var(--t3)}
.ip h5 svg{width:11px;height:11px}
.ip h5 em{font-style:normal;margin-left:auto;font-weight:500;letter-spacing:0;color:var(--t3)}
.ip .kv{gap:7px}
.ip .kv div{align-items:baseline}
.ip .kv span{flex:none}
.ip .kv b{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ip .exif{margin:2px 0}
.ip .empty{border-radius:10px;background:rgba(255,255,255,.05);padding:10px 12px;color:var(--t3);font-size:11.5px;line-height:1.5;display:flex;gap:8px;align-items:center}
.ip .empty b{font-weight:500;color:var(--t2)}
.ip .empty svg{width:15px;height:15px;flex:none;opacity:.8}
.ip .foot{margin-top:auto;display:flex;gap:8px}
.ip .foot .btn{height:28px;font-size:12px;padding:0 12px;flex:1;justify-content:center}
.ip .foot .btn svg{width:13px;height:13px}
.cpy{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--t2);background:rgba(255,255,255,.08)}
.cpy svg{width:12px;height:12px}
/* 新到的缩略图：短暂高亮 2 秒后恢复普通样式 */
.th.new{opacity:1;box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 0 18px rgba(255,255,255,.28)}
.bdg .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:1px}
.th.gone{opacity:.25;filter:grayscale(1)}
/* 键帽 */
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);font:500 12px var(--sf);color:#fff;white-space:nowrap}
.kcs{display:flex;gap:4px;align-items:center;color:var(--t3);font-size:11px}
.new-tag{font:600 9.5px var(--sf);color:var(--accent);background:rgba(10,132,255,.16);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
/* 全屏顶部：系统菜单栏 + 工具栏，鼠标移到顶部时滑下 */
.fsmb{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:center;gap:4px;padding:0 14px;background:rgba(20,20,24,.35);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);font-size:13px;z-index:5}
.fsmb span{padding:3px 8px;border-radius:5px}

.legend{display:flex;gap:28px;flex-wrap:wrap;max-width:1440px}
.legend div{display:flex;flex-direction:column;gap:4px;max-width:330px}
.legend b{font-size:13px;color:var(--label-2)}

.sub{margin:8px 0 -16px;display:flex;align-items:baseline;gap:12px;font:600 20px var(--sfd);color:var(--label-2)}
.sub span{font:500 13px var(--mono);color:var(--label)}

  return`<div class="hist"><svg width="236" height="60" viewBox="0 0 236 60" style="display:block;mix-blend-mode:screen">${pts([[.22,.08,.5],[.62,.12,.8],[.9,.04,.3]],1,'rgba(255,69,58,.55)')}${pts([[.3,.1,.6],[.58,.1,.7],[.85,.05,.25]],2,'rgba(48,209,88,.5)')}${pts([[.15,.07,.7],[.5,.14,.55],[.8,.06,.3]],3,'rgba(10,132,255,.55)')}</svg></div>`}
function infoPanel(it,o={}){const ex=it.ex||[];
  return`<div class="info gt" style="${o.style||''}">
   <div class="hd"><img src="${th(it)}" alt=""><div><b>${it.n}</b><span>${FOLDER}</span></div></div>

   <div><h5>拍摄参数</h5><div class="exif">${['光圈','快门','ISO','焦距'].map((k,i)=>`<div>${ex[i]||'—'}<small>${k}</small></div>`).join('')}</div></div>
   <div class="kv"><div><span>设备</span><b>${it.cam||'—'}</b></div><div><span>镜头</span><b>${it.lens||'—'}</b></div><div><span>拍摄时间</span><b class="m">${it.d||'—'}</b></div></div>

function vbar(it,t,playing,o={}){const p=t/it.dur*100;
  return`<div class="vbar g" style="width:${o.w||580}px;bottom:${o.bottom??128}px;${o.left?`left:${o.left}px;`:''}">

   <span style="color:var(--t2)">${mmss(it.dur)}</span>${ic('loop','ic')}${ic(o.muted?'mute':'vol','ic')}<div class="vol"><i style="width:${o.muted?0:70}%"></i></div></div>`}

/* 主窗口 */
function win(o){
  const W=o.w||1280,H=o.h||800,list=o.list||L,it=o.item?(typeof o.item==='string'?by(o.item):o.item):null,idx=it?list.indexOf(it):0;
  const pnl=o.panel||0,pl=W-16-pnl; /* v0.2 信息面板浮在图片上：图片、缩略图栏、视频条都不动，右箭头也不动，被面板盖住 */
  const top=o.fs?0:64,bot=o.immersive||o.fs?0:(o.nodock?24:132)+(it&&it.vid?58:0),side=o.fs||o.immersive?0:32;
  const sx=side,sw=W-side*2,sh=H-top-bot;
  let stage='';
  if(it&&!it.err){
    if(o.zoom){stage=`<div class="photo flat" style="left:0;top:0;width:${W}px;height:${H}px;background:url(${full(it)}) ${o.zoom.pos}/${o.zoom.size} no-repeat"></div>`}
    else{const[pw,ph]=fit(o.fs||o.immersive?W:sw,o.fs||o.immersive?H:sh,it.w,it.h);const fl=o.fs||o.immersive;
      stage=`<div class="photo ${fl&&pw>=W-2?'flat':''}" style="left:${fl?(W-pw)/2:sx+(sw-pw)/2}px;top:${(fl?0:top)+((fl?H:sh)-ph)/2}px;width:${pw}px;height:${ph}px;${o.blur?'filter:blur(9px) saturate(.9);':''}"><img src="${full(it)}" alt=""></div>`}}
  const amb=it&&!it.err?`<div class="amb" style="background-image:url(${th(it)})"></div><div class="vig"></div>`:`<div class="amb" style="background:radial-gradient(60% 60% at 30% 30%,rgba(14,59,59,.70),transparent),radial-gradient(60% 60% at 75% 70%,rgba(255,226,160,.15),rgba(18,138,128,.16) 50%,transparent);filter:blur(40px) brightness(.8)"></div>`;
  const chrome=o.immersive?'':`
   ${o.fs?'':`<div class="tb">
      <div class="lights ${o.inactive?'dim':''}"><i></i><i></i><i></i></div>
      ${o.compact?'':`<div class="ttl"><b>${o.title||(it?it.n:(o.en?'Yilan':'一览'))}</b><span>${o.sub||FOLDER}</span></div>`}
      <div class="sp"></div>
      ${o.empty||!it?'':`<div class="pill g">${idx+1} / ${list.length}</div>`}
      ${o.notools?'':`<div class="tools g"><div class="ib ${o.empty?'dis':''}">${ic('rotate')}</div><div class="ib ${o.info||o.panel?'on':''} ${o.empty?'dis':''}">${ic('info')}</div><div class="ib">${ic('more')}</div></div>`}
    </div>`}
   ${o.noseg?'':seg(o.filter||'all',{empty:o.empty,icons:o.compact,en:o.en,list:o.segList,style:o.fs?'top:16px':''})}
   ${it&&!o.empty&&!o.nonav?`<div class="nav g" style="left:${o.fs?24:20}px;top:${top+sh/2-22}px;${idx===0?'opacity:.35':''}">${ic('chevL')}</div><div class="nav g" style="right:${o.fs?24:20}px;top:${top+sh/2-22}px;${o.info||pnl?'display:none;':''}">${ic('chevR')}</div>`:''}
   ${it&&!o.nodock?dock(list,idx,W,{dw:o.dw,tw:o.tw,hov:o.hov,en:o.en,cls:o.cls}):''}
  `;
  const fsChrome=o.fs&&o.fsdock?dock(list,idx,W,{dw:960}):'';
  return`<div class="win ${o.fs?'fs':''}" style="width:${W}px;height:${H}px">${amb}${stage}${o.fs&&!o.fsdock?'':''}${o.fs?(o.fsdock?fsChrome+seg(o.filter||'all',{style:'top:18px'}):''):chrome}${o.extra||''}</div>`}
